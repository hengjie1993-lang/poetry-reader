<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ede1" />
  <title>小诗囊 · 亲子朗读</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      --paper:#f3ede1; --card:#fffdf8; --ink:#2b2622; --muted:#9a886a;
      --accent:#a23b2e; --line:#e6ddca; --soft:#efe7d6;
      /* 随屏幕比例自适应的字号 */
      --fs-brand: clamp(18px, 5vw, 22px);
      --fs-title: clamp(22px, 6.4vw, 32px);
      --fs-author: clamp(13px, 3.4vw, 15px);
      --fs-line: clamp(19px, 5.4vw, 25px);
      --fs-py: clamp(11px, 2.9vw, 13px);
      --fs-meta: clamp(12px, 3.2vw, 14px);
      --fs-btn: clamp(14px, 3.6vw, 16px);
      --gap-line: clamp(2px, 1.2vw, 8px);
      --pad-x: clamp(14px, 4.5vw, 22px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;}
    body{
      background:var(--paper); color:var(--ink);
      font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none;
    }
    [v-cloak]{display:none;}
    #app{
      max-width:620px;margin:0 auto;min-height:100dvh;
      display:flex;flex-direction:column;
      padding:calc(env(safe-area-inset-top) + 10px) var(--pad-x) calc(120px + env(safe-area-inset-bottom));
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .brand{font-size:var(--fs-brand);font-weight:600;letter-spacing:2px;white-space:nowrap;}
    .brand .dot{color:var(--accent);}
    .top-actions{display:flex;gap:8px;flex-shrink:0;}
    .btn{
      border:1px solid var(--line);background:var(--card);color:var(--ink);
      border-radius:999px;padding:8px 14px;font-size:var(--fs-btn);
      font-family:inherit;cursor:pointer;line-height:1;white-space:nowrap;
      transition:transform .05s, background .15s;
    }
    .btn:active{transform:scale(.96);background:var(--soft);}
    .btn.ghost{background:transparent;}
    .search-wrap{position:relative;margin-top:12px;}
    .search{
      width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;
      padding:13px 44px 13px 16px;font-size:var(--fs-btn);font-family:inherit;color:var(--ink);outline:none;
    }
    .search::placeholder{color:var(--muted);}
    .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
      width:26px;height:26px;border-radius:50%;border:none;background:var(--soft);color:var(--muted);
      font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .meta{font-size:var(--fs-meta);color:var(--muted);padding:10px 2px 4px;display:flex;justify-content:space-between;gap:8px;}
    .meta .count{font-variant-numeric:tabular-nums;}
    .stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
    .card{
      width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;
      padding:clamp(22px,6vw,34px) clamp(14px,4vw,22px);margin-top:6px;
      box-shadow:0 3px 16px rgba(80,60,30,.06);
    }
    .title-rule{width:48px;height:3px;background:var(--accent);margin:14px auto 18px;border-radius:2px;opacity:.85;}

    /* 标题 / 作者：逐字拼音。拼音绝对定位，避免长拼音(chuang/zhuang)撑宽字距 */
    .tp-block{display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;}
    .tp-block.has-py{row-gap:17px; padding-bottom:17px;}
    .tp-block .char-pair{position:relative; display:inline-flex; justify-content:center; min-width:1em;}
    .tp-block .char-pair.punct{min-width:0; opacity:.75;}
    .tp-block .char-pair .py{
      position:absolute; top:100%; left:50%; transform:translateX(-50%);
      white-space:nowrap; line-height:1.1; margin-top:2px;
      font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    }
    .title-block{font-size:var(--fs-title); line-height:1.3;}
    .title-block .han{font-weight:600; letter-spacing:2px;}
    .title-block .py{font-size:var(--fs-py); color:var(--muted);}
    .author-block{font-size:var(--fs-author); color:var(--muted); margin-bottom:clamp(14px,4.5vw,22px);}
    .author-block .han{letter-spacing:1px;}
    .author-block .py{font-size:calc(var(--fs-py) * 0.88); color:var(--muted); opacity:.85;}

    /* ===== 诗词正文：逐字对应拼音 ===== */
    .verse{margin:clamp(8px,2vw,12px) 0;}
    .verse.para-break{margin-top:clamp(18px,5vw,26px);}
    .line-flex{
      display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end;
      gap: 0.06em 0.12em;
      padding: clamp(4px,1.4vw,8px) 0;
    }
    .char-pair{
      display:inline-flex; flex-direction:column; align-items:center; justify-content:flex-end;
      min-width:1.05em; max-width:2.6em;
    }
    .char-pair .han{
      font-size:var(--fs-line); color:var(--ink); line-height:1.15; text-align:center; letter-spacing:0;
    }
    .char-pair .py{
      font-size:var(--fs-py);
      color:var(--muted);
      font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.1; margin-top: clamp(3px,0.9vw,6px);
      height:1.15em; white-space:nowrap;
    }
    .char-pair .py.empty{visibility:hidden;}
    .char-pair.punct{min-width:auto; padding:0 0.02em; opacity:.7;}
    .char-pair.punct .han{font-size: clamp(15px,4.2vw,20px);}
    .char-pair.punct .py{visibility:hidden;}

    /* 隐藏拼音时：不渲染拼音节点，并收紧字宽与行距，避免行间留白 */
    .card.no-py .verse{margin:clamp(6px,1.6vw,10px) 0;}
    .card.no-py .verse.para-break{margin-top:clamp(15px,4vw,22px);}
    .line-flex.no-py{padding:clamp(3px,1vw,5px) 0;}
    .line-flex.no-py .char-pair{min-width:0; max-width:none;}
    .line-flex.no-py .char-pair.punct{padding:0 0.01em;}

    .nav{
      position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;
      padding:12px var(--pad-x) calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,var(--paper) 72%,rgba(243,237,225,0));
      max-width:620px;margin:0 auto;
    }
    .nav .btn{flex:1;max-width:170px;text-align:center;}
    .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;}
    .drawer{
      position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:80vh;background:var(--paper);
      border-radius:20px 20px 0 0;z-index:21;padding:14px clamp(12px,4vw,18px) calc(20px + env(safe-area-inset-bottom));
      overflow-y:auto;-webkit-overflow-scrolling:touch;
    }
    .drawer h3{margin:6px 6px 12px;font-size:var(--fs-author);color:var(--muted);font-weight:500;}
    .item{padding:13px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
    .item .t{font-size:var(--fs-btn);}
    .item .a{font-size:var(--fs-py);color:var(--muted);flex-shrink:0;}
    .item.active{background:var(--card);border-radius:12px;}
    .empty{text-align:center;color:var(--muted);padding:48px 0;font-size:var(--fs-btn);}
    .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:var(--fs-btn);}
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div class="topbar">
      <div class="brand">小<span class="dot">诗</span>囊</div>
      <div class="top-actions">
        <button class="btn ghost" @click="showPinyin=!showPinyin">{{ showPinyin ? '隐藏拼音' : '显示拼音' }}</button>
        <button class="btn" @click="shuffle">随机</button>
        <button class="btn" @click="openList">列表</button>
      </div>
    </div>

    <div class="search-wrap">
      <input class="search" v-model="query" placeholder="搜索 静夜思 / 李白 / 唐 / 春风 / chun" />
      <button class="search-clear" v-if="query" @click="query=''">×</button>
    </div>

    <div class="meta">
      <span class="count">共 {{ view.length }} 首</span>
      <span v-if="view.length">第 {{ idx+1 }} 首</span>
    </div>

    <div class="stage" v-if="current">
      <div :class="['card', {'no-py': !showPinyin}]">
        <div :class="['title-block','tp-block',{'has-py': showPinyin}]">
          <span v-for="(c,j) in titleBlocks" :key="j" :class="['char-pair',{punct:c.isPunct}]">
            <span class="han">{{ c.char }}</span>
            <span v-if="showPinyin && !c.isPunct" class="py">{{ c.py }}</span>
          </span>
        </div>
        <div class="title-rule"></div>
        <div :class="['author-block','tp-block',{'has-py': showPinyin}]">
          <span v-for="(c,j) in authorBlocks" :key="j" :class="['char-pair',{punct:c.isPunct}]">
            <span class="han">{{ c.char }}</span>
            <span v-if="showPinyin && !c.isPunct" class="py">{{ c.py }}</span>
          </span>
        </div>
        <div :class="['verse', { 'para-break': line.paraBreak }]" v-for="(line,i) in poemLines" :key="i">
          <div :class="['line-flex', {'no-py': !showPinyin}]">
            <span v-for="(c,j) in line.blocks" :key="j" :class="['char-pair', {punct: c.isPunct}]">
              <span class="han">{{ c.char }}</span>
              <span v-if="showPinyin && !c.isPunct" :class="['py', {empty: !c.py}]">{{ c.py }}</span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="loading" v-else-if="!loaded">正在加载诗词…</div>
    <div class="empty" v-else>没有匹配的诗</div>

    <div class="nav" v-if="view.length">
      <button class="btn" @click="prev">上一首</button>
      <button class="btn" @click="shuffle">随机</button>
      <button class="btn" @click="next">下一首</button>
    </div>

    <div class="drawer-mask" v-if="showList" @click="showList=false"></div>
    <div class="drawer" v-if="showList">
      <h3>全部诗词（点击切换）</h3>
      <div v-for="(p,i) in view" :key="p.id"
           class="item" :class="{active: p.id===current.id}" @click="selectFromList(i)">
        <span class="t">{{ p.title }}</span>
        <span class="a">〔{{ p.dynasty }}〕{{ p.author }}</span>
      </div>
      <div class="empty" v-if="!view.length">没有匹配的诗</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script>
  <script>
    const APP_VERSION = '10';
    const { createApp } = Vue;
    function toPinyin(text, opts={toneType:'symbol', type:'string'}){
      try {
        if (window.pinyinPro && window.pinyinPro.pinyin) {
          return window.pinyinPro.pinyin(text, opts);
        }
      } catch(e){}
      return '';
    }
    function pinyinArray(text){
      try {
        if (window.pinyinPro && window.pinyinPro.pinyin) {
          return window.pinyinPro.pinyin(text, { toneType:'symbol', type:'array' });
        }
      } catch(e){}
      return [];
    }
    function isPunct(ch){
      return /[\p{P}\s]/u.test(ch);
    }
    // 手机端：按诗词小句拆分（逗号、句号、顿号、问号、叹号、分号），一句一行；保留标点在末尾
    function splitClauses(para){
      const clauses = [];
      let start = 0;
      for(let i=0;i<para.length;i++){
        if(/[，。！？、；：]/.test(para[i])){
          clauses.push(para.slice(start, i+1));
          start = i+1;
        }
      }
      if(start < para.length) clauses.push(para.slice(start));
      if(!clauses.length) clauses.push(para);
      return clauses;
    }
    createApp({
      data(){
        return { all:[], query:'', idx:0, showList:false, showPinyin:true, loaded:false, _indexed:false, isMobileMode:false };
      },
      computed: {
        view(){
          const q = this.query.trim().toLowerCase();
          if(!q) return this.all;
          this.ensureIndex();
          return this.all.filter(p => (p._search||'').includes(q));
        },
        current(){ return this.view[this.idx] || null; },
        poemLines(){
          if(!this.current) return [];
          const lines = [];
          this.current.paragraphs.forEach((para, pIdx) => {
            const segments = this.isMobileMode ? splitClauses(para) : [para];
            segments.forEach((seg, sIdx) => {
              lines.push({ blocks: this.buildBlocks(seg), paraBreak: pIdx > 0 && sIdx === 0 });
            });
          });
          return lines;
        },
        titleBlocks(){ return this.current ? this.buildBlocks(this.current.title) : []; },
        authorText(){ return this.current ? '〔' + this.current.dynasty + '〕' + this.current.author : ''; },
        authorBlocks(){ return this.current ? this.buildBlocks(this.authorText) : []; }
      },
      watch: {
        query(){ this.idx = 0; },
        view(){ if(this.idx >= this.view.length) this.idx = 0; }
      },
      methods: {
        // 把一段文字拆成「汉字块」，逐字配拼音；标点粘附到前一个汉字，不单独占位
        buildBlocks(text){
          const chars = text.split('');
          const pys = this.showPinyin ? pinyinArray(text) : [];
          const blocks = [];
          for(let i=0;i<chars.length;i++){
            const ch = chars[i];
            const py = pys[i] || '';
            if(isPunct(ch)){
              if(blocks.length && !blocks[blocks.length-1].isPunct){
                blocks[blocks.length-1].char += ch;
              }else{
                blocks.push({char:ch, py:'', isPunct:true});
              }
            }else{
              blocks.push({char:ch, py:py, isPunct:false});
            }
          }
          return blocks;
        },
        ensureIndex(){
          if(this._indexed) return;
          for(const p of this.all){
            const hay = (p.title + p.author + p.dynasty + p.paragraphs.join('')).toLowerCase();
            const py = toPinyin(p.title + p.author + p.paragraphs.join(''));
            p._search = (hay + ' ' + py).toLowerCase();
          }
          this._indexed = true;
        },
        prev(){ if(this.view.length) this.idx = (this.idx - 1 + this.view.length) % this.view.length; },
        next(){ if(this.view.length) this.idx = (this.idx + 1) % this.view.length; },
        shuffle(){ if(this.view.length) this.idx = Math.floor(Math.random()*this.view.length); },
        openList(){ this.showList = true; },
        selectFromList(i){ this.idx = i; this.showList = false; },
        onKey(e){
          if(this.showList) return;
          if(e.key==='ArrowLeft') this.prev();
          else if(e.key==='ArrowRight') this.next();
        }
      },
      async mounted(){
        // 响应式判断：手机端按小句分行，Web 端整句自然换行
        const mq = window.matchMedia('(max-width: 640px)');
        this.isMobileMode = mq.matches;
        try {
          mq.addEventListener('change', e => this.isMobileMode = e.matches);
        } catch(e) {
          // 旧版浏览器回退
          mq.addListener(e => this.isMobileMode = e.matches);
        }

        const urls = ['poems.json?v=' + APP_VERSION, 'poems.json'];
        let lastErr = null;
        for(const url of urls){
          try{
            const res = await fetch(url);
            if(!res.ok){ lastErr = 'HTTP ' + res.status; continue; }
            const ct = res.headers.get('content-type') || '';
            if(!ct.includes('json')){ lastErr = '返回的不是 JSON(' + ct + ')'; continue; }
            this.all = await res.json();
            this.loaded = true;
            lastErr = null;
            break;
          }catch(e){ lastErr = e && e.message ? e.message : String(e); }
        }
        if(lastErr){
          this.loaded = true;
          alert('加载诗词数据失败：' + lastErr + '\n请检查网络，或退出微信浮窗后重新打开链接。');
        }
        window.addEventListener('keydown', this.onKey);
      }
    }).mount('#app');

    // 微信内置浏览器对 Service Worker 支持差且缓存陷阱多，直接禁用；其他浏览器保留 PWA 能力
    const isWechat = /MicroMessenger/i.test(navigator.userAgent);
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !isWechat) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(()=>{});
      });
    } else if ('serviceWorker' in navigator && isWechat) {
      // 若已有旧 SW，注销掉避免它拦截 poems.json
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
    }
  </script>
</body>
</html>

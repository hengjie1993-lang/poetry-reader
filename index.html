<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ede1" />
  <title>诗词 · 亲子朗读</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      --paper:#f3ede1; --card:#fffdf8; --ink:#2b2622; --muted:#8a7a5c;
      --accent:#a23b2e; --line:#e6ddca;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--paper); color:var(--ink);
      font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
      min-height:100vh;
    }
    #app{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));}
    [v-cloak]{display:none;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
    .brand{font-size:20px;font-weight:600;letter-spacing:2px;}
    .brand .dot{color:var(--accent);}
    .top-actions{display:flex;gap:8px;}
    .btn{
      border:1px solid var(--line);background:var(--card);color:var(--ink);
      border-radius:20px;padding:7px 14px;font-size:14px;font-family:inherit;cursor:pointer;
    }
    .btn:active{transform:scale(.97);}
    .search{
      width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;
      padding:12px 16px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;
    }
    .search::placeholder{color:var(--muted);}
    .meta{font-size:13px;color:var(--muted);padding:10px 4px 4px;}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:18px;
      padding:26px 20px;margin-top:8px;box-shadow:0 2px 10px rgba(0,0,0,.04);
    }
    .title{font-size:26px;font-weight:600;text-align:center;letter-spacing:2px;}
    .title-rule{width:46px;height:3px;background:var(--accent);margin:12px auto 18px;border-radius:2px;}
    .author{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px;}
    .line{font-size:21px;line-height:1.9;text-align:center;letter-spacing:1px;}
    .py{font-size:13px;line-height:1.6;text-align:center;color:var(--muted);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;margin-bottom:14px;}
    .nav{
      position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,var(--paper) 70%,rgba(243,237,225,0));
    }
    .nav .btn{flex:1;max-width:160px;text-align:center;font-size:15px;}
    .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;}
    .drawer{
      position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:var(--paper);
      border-radius:18px 18px 0 0;z-index:21;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
      overflow-y:auto;
    }
    .drawer h3{margin:4px 6px 12px;font-size:15px;color:var(--muted);font-weight:500;}
    .item{padding:13px 10px;border-bottom:1px solid var(--line);cursor:pointer;}
    .item .t{font-size:17px;}
    .item .a{font-size:12px;color:var(--muted);margin-top:2px;}
    .item.active{background:var(--card);border-radius:10px;}
    .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px;}
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div class="topbar">
      <div class="brand">诗<span class="dot">·</span>词</div>
      <div class="top-actions">
        <button class="btn" @click="shuffle">随机</button>
        <button class="btn" @click="openList">列表</button>
      </div>
    </div>

    <input class="search" v-model="query" placeholder="搜索 静夜思 / 李白 / 唐 / 春风" />

    <div class="meta" v-if="view.length">共 {{ view.length }} 首 · 第 {{ idx+1 }} 首</div>
    <div class="meta" v-else>没有匹配的诗</div>

    <div class="card" v-if="current">
      <div class="title">{{ current.title }}</div>
      <div class="title-rule"></div>
      <div class="author">〔{{ current.dynasty }}〕{{ current.author }}</div>
      <div v-for="(p,i) in current.paragraphs" :key="i">
        <div class="line">{{ p }}</div>
        <div class="py" v-if="pinyin[i]">{{ pinyin[i] }}</div>
      </div>
    </div>

    <div class="nav" v-if="view.length">
      <button class="btn" @click="prev">上一首</button>
      <button class="btn" @click="shuffle">随机</button>
      <button class="btn" @click="next">下一首</button>
    </div>

    <div class="drawer-mask" v-if="showList" @click="showList=false"></div>
    <div class="drawer" v-if="showList">
      <h3>全部诗词（点击切换）</h3>
      <div v-for="(p,i) in view" :key="p.id"
           class="item" :class="{active: p.id===current.id}" @click="selectFromList(i)">
        <div class="t">{{ p.title }}</div>
        <div class="a">〔{{ p.dynasty }}〕{{ p.author }}</div>
      </div>
      <div class="empty" v-if="!view.length">没有匹配的诗</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script>
  <script>
    const { createApp } = Vue;

    function toPinyin(text){
      try {
        if (window.pinyinPro && window.pinyinPro.pinyin) {
          return window.pinyinPro.pinyin(text, { toneType: 'symbol', type: 'string' });
        }
      } catch(e){}
      return '';
    }

    createApp({
      data(){
        return {
          all: [],
          query: '',
          idx: 0,
          showList: false,
        };
      },
      computed: {
        view(){
          const q = this.query.trim().toLowerCase();
          if(!q) return this.all;
          return this.all.filter(p => p._search.includes(q));
        },
        current(){
          return this.view[this.idx] || null;
        },
        pinyin(){
          if(!this.current) return [];
          return this.current.paragraphs.map(toPinyin);
        }
      },
      watch: {
        query(){ this.idx = 0; },
        view(){ if(this.idx >= this.view.length) this.idx = 0; }
      },
      methods: {
        prev(){ if(this.view.length) this.idx = (this.idx - 1 + this.view.length) % this.view.length; },
        next(){ if(this.view.length) this.idx = (this.idx + 1) % this.view.length; },
        shuffle(){ if(this.view.length) this.idx = Math.floor(Math.random()*this.view.length); },
        openList(){ this.showList = true; },
        selectFromList(i){ this.idx = i; this.showList = false; }
      },
      async mounted(){
        try{
          const res = await fetch('poems.json', { cache:'no-cache' });
          const data = await res.json();
          data.forEach(p => {
            const hay = (p.title + p.author + p.dynasty + p.paragraphs.join('')).toLowerCase();
            const py = toPinyin(p.title + p.author + p.paragraphs.join(''));
            p._search = (hay + ' ' + py).toLowerCase();
          });
          this.all = data;
        }catch(e){
          alert('加载 poems.json 失败：请通过本地服务器或 GitHub Pages 打开（不要用 file:// 直接双击）。');
        }
      }
    }).mount('#app');

    // 简易 PWA：首次访问后缓存本地文件，弱网/离线也能看
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
